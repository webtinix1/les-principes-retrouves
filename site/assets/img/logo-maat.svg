<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" role="img" aria-label="Logo Plume de Maât — Les Principes Retrouvés">
  <!-- Aile gauche (π1 = lecture en distinction) -->
  <g class="maat-wing maat-wing--left" fill="none" stroke="#D4AF37" stroke-width="4.5" stroke-linecap="round">
    <path d="M92 56 C 66 44, 42 46, 18 54"/>
    <path d="M92 64 C 64 56, 40 60, 14 72"/>
    <path d="M92 72 C 66 68, 44 76, 22 90"/>
    <path d="M92 80 C 70 80, 52 88, 34 102"/>
  </g>
  <!-- Aile droite (π2 = lecture en relation) -->
  <g class="maat-wing maat-wing--right" fill="none" stroke="#D4AF37" stroke-width="4.5" stroke-linecap="round">
    <path d="M108 56 C 134 44, 158 46, 182 54"/>
    <path d="M108 64 C 136 56, 160 60, 186 72"/>
    <path d="M108 72 C 134 68, 156 76, 178 90"/>
    <path d="M108 80 C 130 80, 148 88, 166 102"/>
  </g>
  <!-- Plume centrale (Σ = Unité Structurelle Absolue) -->
  <g class="maat-feather">
    <path d="M100 14 C 110 44, 110 100, 100 130 C 90 100, 90 44, 100 14 Z" fill="#D4AF37"/>
    <line x1="100" y1="24" x2="100" y2="122" stroke="#1a252f" stroke-width="1.6"/>
    <g stroke="#1a252f" stroke-width="1" opacity="0.75">
      <line x1="100" y1="40" x2="94" y2="48"/><line x1="100" y1="40" x2="106" y2="48"/>
      <line x1="100" y1="56" x2="92" y2="66"/><line x1="100" y1="56" x2="108" y2="66"/>
      <line x1="100" y1="74" x2="92" y2="84"/><line x1="100" y1="74" x2="108" y2="84"/>
      <line x1="100" y1="92" x2="94" y2="100"/><line x1="100" y1="92" x2="106" y2="100"/>
    </g>
  </g>
</svg>
