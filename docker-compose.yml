# Portail École de Brazzaville — APPLICATION Next.js + back-office Payload CMS
# (PostgreSQL) derrière Traefik.
# (L'ancien déploiement statique nginx est archivé dans docker-compose.static.yml.ex.)
# Tout est piloté par le .env (domaine, nom de routeur, fuseau, DB, paiement).
# Pré-requis : réseau Docker externe "traefik-platform-network" (Traefik : entrypoint
# "websecure" + certresolver "le").

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-principes-retrouves}-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Durcissement : pas d'escalade de privilèges, aucune capability Linux
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-Africa/Brazzaville}
      NODE_ENV: production
      # Base Payload (service "db" ci-dessous, réseau interne)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Clé de chiffrement des sessions du back-office (obligatoire, longue et aléatoire)
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET manquant dans .env}
      # Premier compte administrateur (créé seulement si aucun compte n'existe)
      PAYLOAD_ADMIN_EMAIL: ${PAYLOAD_ADMIN_EMAIL:-}
      PAYLOAD_ADMIN_PASSWORD: ${PAYLOAD_ADMIN_PASSWORD:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      # Paiement Chariow (vides tant que non configuré)
      CHARIOW_API_KEY: ${CHARIOW_API_KEY:-}
      CHARIOW_WEBHOOK_SECRET: ${CHARIOW_WEBHOOK_SECRET:-}
      CHARIOW_PRODUCT_MAP: ${CHARIOW_PRODUCT_MAP:-}
      # Formulaire de contact (Lot 3) — vides = mode dégradé (persistance seule)
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CONTACT_INBOX_EMAIL: ${CONTACT_INBOX_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    volumes:
      # PDF intégraux téléversés depuis le back-office (/app/data/documents)
      - app-data:/app/data
    expose:
      - "3000"
    networks:
      - traefik-platform-network
      - interne
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-platform-network"

      # Router (nom unique par instance pour éviter les collisions)
      - "traefik.http.routers.site-${TRAEFIK_CONFIG_NAME}.rule=Host(`${SITE_HOST}`)"
      - "traefik.http.routers.site-${TRAEFIK_CONFIG_NAME}.entrypoints=websecure"
      - "traefik.http.routers.site-${TRAEFIK_CONFIG_NAME}.tls.certresolver=le"
      - "traefik.http.routers.site-${TRAEFIK_CONFIG_NAME}.service=site-${TRAEFIK_CONFIG_NAME}"

      # Service (Next.js écoute sur 3000)
      - "traefik.http.services.site-${TRAEFIK_CONFIG_NAME}.loadbalancer.server.port=3000"

      # Sécurité : redirection HTTPS + HSTS
      - "traefik.http.middlewares.site-${TRAEFIK_CONFIG_NAME}-secure.headers.sslredirect=true"
      - "traefik.http.middlewares.site-${TRAEFIK_CONFIG_NAME}-secure.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.site-${TRAEFIK_CONFIG_NAME}-secure.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.site-${TRAEFIK_CONFIG_NAME}.middlewares=site-${TRAEFIK_CONFIG_NAME}-secure"

      # Back-office /admin : router prioritaire protégé par basic-auth
      - "traefik.http.routers.admin-${TRAEFIK_CONFIG_NAME}.rule=Host(`${SITE_HOST}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.admin-${TRAEFIK_CONFIG_NAME}.entrypoints=websecure"
      - "traefik.http.routers.admin-${TRAEFIK_CONFIG_NAME}.tls.certresolver=le"
      - "traefik.http.routers.admin-${TRAEFIK_CONFIG_NAME}.service=site-${TRAEFIK_CONFIG_NAME}"
      - "traefik.http.routers.admin-${TRAEFIK_CONFIG_NAME}.priority=1000"
      - "traefik.http.middlewares.admin-${TRAEFIK_CONFIG_NAME}-auth.basicauth.users=${ADMIN_BASIC_AUTH}"
      - "traefik.http.routers.admin-${TRAEFIK_CONFIG_NAME}.middlewares=admin-${TRAEFIK_CONFIG_NAME}-auth,site-${TRAEFIK_CONFIG_NAME}-secure"

  # PostgreSQL — base du back-office Payload. Jamais exposé à Traefik.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      TZ: ${TZ:-Africa/Brazzaville}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - interne
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Conteneur « outils » (étape de build complète : sources + node_modules).
  # Ne démarre jamais seul. Usage — reprise de l'ancienne base SQLite :
  #   docker compose --profile outils run --rm \
  #     -v /chemin/prod.db:/import/prod.db -e SQLITE_FILE=/import/prod.db \
  #     outils yarn import:sqlite
  outils:
    profiles: ["outils"]
    build:
      context: ./web
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NODE_ENV: production
      DOCUMENTS_DIR: /app/data/documents
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interne

networks:
  traefik-platform-network:
    external: true
  # Réseau privé application ↔ base de données
  interne:

volumes:
  app-data: # Documents protégés téléversés (PDF) + ancien prod.db SQLite à reprendre
  db-data:  # PostgreSQL (Payload)
