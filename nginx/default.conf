server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # En-têtes de sécurité (HSTS et redirection HTTPS sont gérés par Traefik)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pages : sert le fichier .html demandé, sinon 404
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache long pour les assets versionnables
    location ~* \.(?:css|js|svg|webp|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Le HTML n'est pas mis en cache agressivement (maquette en évolution)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # robots / sitemap accessibles
    location = /robots.txt  { access_log off; }
    location = /sitemap.xml { access_log off; }

    error_page 404 /index.html;
}
